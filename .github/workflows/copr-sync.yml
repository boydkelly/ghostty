name: Sync upstream and merge into local
permissions:
  contents: write
on:
  schedule:
    - cron: '0 3 * * *'  # once a day at 03:00 UTC
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream and fetch with tags
        run: |
          git remote add upstream https://github.com/ghostty-org/ghostty.git
          git fetch upstream --tags --force
      - name: Fast-forward main from upstream
        run: |
          git checkout -B main origin/main
          git merge --ff-only upstream/main
          git push origin main
          git push origin tip --force
      - name: Merge main into nightly
        run: |
          git checkout -B nightly origin/nightly
          git merge upstream/main --no-edit
          git push origin nightly --force
          git push origin tip --force

